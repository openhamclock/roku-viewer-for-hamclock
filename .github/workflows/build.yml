name: Build Roku package

on:
  push:
    branches: [main]       # every push to main builds and updates the Release
    tags: ['v*']
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  pull_request:            # build-only check on PRs

permissions:
  contents: write          # needed only to attach the zip to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: ver
        run: |
          get() { grep -E "^$1=" channel/manifest | cut -d= -f2 | tr -d '\r '; }
          V="$((10#$(get major_version))).$((10#$(get minor_version))).$((10#$(get build_version)))"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $V"

      - name: Build store package (no baked-in address)
        run: bash tools/build.sh

      - name: Check the package
        run: |
          set -e
          Z=dist/hamclock-roku.zip
          if unzip -p "$Z" manifest | grep -q '^default_address='; then
            echo "::error::default_address found in manifest - store build must not bake in an address"; exit 1
          fi
          SIZE=$(stat -c %s "$Z")
          echo "Package size: $SIZE bytes"
          [ "$SIZE" -lt 4194304 ] || { echo "::error::package is over Roku's 4 MB limit"; exit 1; }
          unzip -l "$Z" | grep -q ' manifest$'

      - name: Name the zip with its version
        run: cp dist/hamclock-roku.zip "dist/hamclock-roku-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: hamclock-roku-${{ steps.ver.outputs.version }}
          path: dist/hamclock-roku-${{ steps.ver.outputs.version }}.zip

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ZIP="dist/hamclock-roku-${{ steps.ver.outputs.version }}.zip"
          TAG="v${{ steps.ver.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::warning::tag $GITHUB_REF_NAME does not match manifest version $TAG; using the tag"
            TAG="$GITHUB_REF_NAME"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber      # same version: replace the zip
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
